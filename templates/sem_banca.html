{% load linguas %}

<table id="SemBancasTable" class="table table-borderless table-sm arredondado"><tbody>
  {% for projeto in sem_banca %}
    <tr class="item"><td>
      <div class="agendamento">
        <div>{% include "cabecalho_projeto.html" with com_tit_original=True %}</div>
        <div class="editar esconder">
          <a class="open-modal" data-url="{% url 'bancas_criar' %}" href="{% url 'bancas_criar'%}">
            <button class="btn btn-primary mb-1 ml-3 mt-1"
            {% if user.tipo_de_usuario != 4 and user != projeto.orientador.user %}disabled{% endif %}>
              {% lng "Criar" "Create" %}
            </button>
          </a>
        </div>
      </div>
    </td></tr>
  {% endfor %}
</tbody></table>
